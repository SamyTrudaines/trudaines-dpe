# Envoi postal des courriers de la veille des légataires par MySendingBox
# (scripts/legataires-envoi.mjs). Il part aussi chaque lundi après la veille
# (legataires.yml) ; ce workflow sert à le relancer à la main. En essai, lettres de test
# sans envoi ni facture et feuille intacte ; en réel, les lettres partent et les avis sont marqués.
#
# La feuille se lit par la même fédération sans clé que le relevé Search Console, qui
# n'accepte que main. Le journal, public, ne montre que des nombres.
name: Légataires universels, envoi postal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'essai (rien n’est posté) ou reel (lettres postées, avis marqués)'
        default: 'essai'
        type: choice
        options: ['essai', 'reel']

permissions:
  contents: read
  id-token: write

jobs:
  envoyer:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Identification auprès de Google, sans clé
        id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1043190760192/locations/global/workloadIdentityPools/github/providers/depot
          service_account: releve-search-console@trudaines-511314.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Envoi postal
        env:
          GSC_JETON: ${{ steps.google.outputs.access_token }}
          GSC_FEUILLE: 1W2pG82faVGaflLlWP6qaWuCT2zdEFf2bTJTUaRgmLe8
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MYSENDINGBOX_API_KEY: ${{ secrets.MYSENDINGBOX_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: node scripts/legataires-envoi.mjs
