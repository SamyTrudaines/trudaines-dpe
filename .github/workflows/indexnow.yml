# Signalement IndexNow des pages changées par chaque fusion sur main, dès que
# la production les sert (scripts/indexnow.mjs ; la clé du protocole est publique,
# servie à la racine du site). Puis envoi des biens devenus diffusables aux
# acquéreurs prioritaires (scripts/acquereurs/envoyer.mjs, secret BREVO_API_KEY),
# en essai adressé à Samy tant que envoiActif est faux.
name: IndexNow

on:
  push:
    branches: ['main']
    paths: ['src/**', 'public/**']

permissions:
  contents: read

# Pas d'annulation : un envoi aux acquéreurs commencé doit aller à son terme.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  signaler:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Signalement IndexNow
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
        run: node scripts/indexnow.mjs

      # Après l'attente de la production : la fiche et ses photos sont en ligne.
      - name: Acquéreurs prioritaires, nouveaux biens
        if: always()
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MODE: reel
        run: npm ci --ignore-scripts && node scripts/acquereurs/envoyer.mjs
