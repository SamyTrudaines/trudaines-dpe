# Back office Trudaines. Connexion avec un compte GitHub ayant accès au dépôt.
backend:
  name: github
  repo: SamyTrudaines/trudaines-dpe
  branch: main
  base_url: https://www.trudaines.com
  auth_endpoint: api/auth
  commit_messages:
    create: 'Ajout {{collection}} « {{slug}} »'
    update: 'Mise à jour {{collection}} « {{slug}} »'
    delete: 'Suppression {{collection}} « {{slug}} »'
    uploadMedia: 'Ajout du média {{path}}'
    deleteMedia: 'Suppression du média {{path}}'

locale: fr
publish_mode: simple
media_folder: public/images/televerses
public_folder: /images/televerses

collections:
  - name: biens
    label: Biens
    label_singular: Bien
    folder: src/content/biens
    create: true
    slug: '{{slug}}'
    summary: '{{titre}} · {{quartier}} · {{prix}} €'
    sortable_fields: [ordre, prix, titre]
    fields:
      - { name: titre, label: Titre de l'annonce, widget: string }
      - { name: reference, label: Référence, widget: string, hint: 'Sert de nom au PDF du dossier, par exemple TRU-2026-014' }
      - { name: quartier, label: Quartier, widget: select, options: [Trudaine Maubeuge, Martyrs Lorette, Clichy Trinité, Montmartre, Lariboisière Rocroy] }
      - { name: arrondissement, label: Code postal, widget: select, options: ['75009', '75010', '75018'] }
      - { name: prix, label: Prix en euros, widget: number, value_type: int, min: 50000 }
      - { name: surface, label: Surface Carrez en m², widget: number, value_type: int, min: 5 }
      - { name: pieces, label: Nombre de pièces, widget: number, value_type: int, min: 1 }
      - { name: chambres, label: Nombre de chambres, widget: number, value_type: int, default: 1 }
      - { name: etage, label: Étage, widget: string, default: '2e avec ascenseur' }
      - { name: ascenseur, label: Ascenseur, widget: boolean, default: false }
      - { name: dpe, label: Classe énergie, widget: select, options: [A, B, C, D, E, F, G, Vierge], default: D }
      - { name: ges, label: Classe climat, widget: select, options: [A, B, C, D, E, F, G, Vierge], default: D }
      - { name: charges, label: Charges annuelles en euros, widget: number, value_type: int, required: false }
      - { name: taxeFonciere, label: Taxe foncière en euros, widget: number, value_type: int, required: false }
      - { name: lotsCopropriete, label: Nombre de lots de la copropriété, widget: number, value_type: int, required: false }
      - { name: procedureCopropriete, label: Procédure en cours dans la copropriété, widget: boolean, default: false }
      - { name: honorairesCharge, label: Honoraires à la charge du, widget: select, options: [vendeur, acquéreur], default: vendeur }
      - { name: honorairesTaux, label: Taux d'honoraires affiché, widget: string, required: false }
      - { name: statut, label: Statut, widget: select, options: [a-vendre, sous-offre, vendu], default: a-vendre }
      - { name: offMarket, label: Vente confidentielle, widget: boolean, default: false, hint: "Le bien n'apparaît alors pas dans la liste publique" }
      - { name: visiteVirtuelle, label: Lien de visite virtuelle, widget: string, required: false }
      - { name: ordre, label: Ordre d'affichage, widget: number, value_type: int, default: 10 }
      - { name: description, label: Accroche, widget: text }
      - name: photos
        label: Photographies
        widget: list
        required: false
        fields:
          - { name: src, label: Fichier, widget: image }
          - { name: alt, label: Description de l'image, widget: string }
      - { name: exemple, label: Fiche de démonstration, widget: boolean, default: false }
      - { name: body, label: Texte détaillé, widget: markdown }

  - name: quartiers
    label: Quartiers
    label_singular: Quartier
    folder: src/content/quartiers
    create: true
    slug: '{{slug}}'
    fields:
      - { name: nom, label: Nom, widget: string }
      - { name: arrondissement, label: Arrondissement, widget: string }
      - { name: secteur, label: Secteur, widget: select, options: [paris-9, paris-10, paris-18] }
      - { name: prixMoyenM2, label: Prix moyen au m², widget: string }
      - { name: fourchette, label: Fourchette observée, widget: string }
      - { name: chapo, label: Chapô, widget: text }
      - { name: ordre, label: Ordre d'affichage, widget: number, value_type: int, default: 10 }
      - { name: titreSeo, label: Titre pour Google, widget: string }
      - { name: descriptionSeo, label: Description pour Google, widget: text }
      - name: photos
        label: Photographies
        widget: list
        required: false
        fields:
          - { name: src, label: Fichier, widget: image }
          - { name: alt, label: Description de l'image, widget: string }
      - name: faits
        label: Faits de marché
        widget: list
        required: false
        fields:
          - { name: titre, label: Intitulé, widget: string }
          - { name: valeur, label: Valeur, widget: string }
      - { name: body, label: Texte de présentation, widget: markdown }

  - name: articles
    label: Panorama
    label_singular: Article
    folder: src/content/articles
    create: true
    slug: '{{slug}}'
    sortable_fields: [date, titre]
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: date, label: Date de publication, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false }
      - { name: dateMaj, label: Date de mise à jour, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, required: false }
      - { name: image, label: Image principale, widget: image, required: false }
      - { name: imageAlt, label: Description de l'image, widget: string, required: false }
      - { name: chapo, label: Chapô, widget: text }
      - { name: motsCles, label: Mots clés, widget: list, required: false }
      - { name: brouillon, label: Brouillon, widget: boolean, default: false }
      - { name: body, label: Article, widget: markdown }

  - name: presse
    label: Presse
    label_singular: Retombée presse
    folder: src/content/presse
    create: true
    slug: '{{slug}}'
    fields:
      - { name: media, label: Média, widget: string }
      - { name: logo, label: Logo du média, widget: image, required: false }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false }
      - { name: titre, label: Titre de l'article, widget: string }
      - { name: citation, label: Citation, widget: text }
      - { name: lien, label: Lien vers l'article, widget: string, required: false }
      - { name: body, label: Notes internes, widget: markdown, required: false }

  - name: avis
    label: Avis clients
    label_singular: Avis
    folder: src/content/avis
    create: true
    slug: '{{slug}}'
    fields:
      - { name: auteur, label: Auteur, widget: string }
      - { name: quartier, label: Quartier, widget: string }
      - { name: secteur, label: Secteur, widget: select, options: [paris-9, paris-10, paris-18], required: false }
      - { name: typeProjet, label: Type de projet, widget: select, options: [Vente, Achat, Recherche, Location], required: false, hint: "À ne remplir que si l'avis dit lui même de quel projet il s'agit" }
      - { name: texte, label: Avis, widget: text, required: false, hint: 'À laisser vide quand le client a mis une note sans écrire de commentaire' }
      - { name: note, label: Note sur 5, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { name: source, label: Plateforme, widget: select, options: [google, pagesjaunes, direct], default: google }
      - { name: lienSource, label: Lien vers la fiche, widget: string, required: false, hint: "Adresse de la fiche Google du cabinet, pour que le visiteur puisse vérifier" }
      - { name: anciennete, label: Ancienneté affichée, widget: string, required: false, hint: "Recopier ce qu'affiche la plateforme, « il y a 3 mois » par exemple" }
      - { name: dateVisite, label: Mention de visite, widget: string, required: false, hint: "Recopier ce qu'affiche Google, « Visité en mars » par exemple" }
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD/MM/YYYY', time_format: false, required: false }
      - { name: exemple, label: Avis de démonstration, widget: boolean, default: false }
      - { name: body, label: Notes internes, widget: markdown, required: false }

  - name: guides
    label: Guides
    label_singular: Guide
    folder: src/content/guides
    create: true
    slug: '{{slug}}'
    fields:
      - { name: titre, label: Titre, widget: string }
      - { name: slug, label: Identifiant du fichier, widget: string, hint: 'Sans espace ni accent, par exemple guide-prix-2026-9e-nord' }
      - { name: chapo, label: Chapô, widget: text }
      - { name: sommaire, label: Sommaire, widget: list, required: false }
      - { name: pages, label: Nombre de pages, widget: number, value_type: int, default: 0 }
      - { name: fichier, label: Chemin du PDF, widget: string, default: /guides/mon-guide.pdf }
      - { name: listeBrevo, label: Liste Brevo, widget: select, options: [telechargements, vendeurs, acheteurs], default: telechargements }
      - { name: disponible, label: Disponible au téléchargement, widget: boolean, default: true }
      - { name: body, label: Contenu du guide, widget: markdown }

  - name: pages
    label: Pages éditoriales
    label_singular: Page
    folder: src/content/pages
    create: false
    fields:
      - { name: titre, label: Titre affiché, widget: string }
      - { name: titreSeo, label: Titre pour Google, widget: string }
      - { name: descriptionSeo, label: Description pour Google, widget: text }
      - { name: chapo, label: Chapô, widget: text, required: false }
      - { name: body, label: Contenu, widget: markdown }
